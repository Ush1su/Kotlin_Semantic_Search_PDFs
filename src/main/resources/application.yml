spring:
  config:
    import: optional:file:./app.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_SIZE:50MB}

app:
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./data/uploads}

  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    use-tls: ${QDRANT_USE_TLS:false}
    collection-name: ${QDRANT_COLLECTION_NAME:chunks}
    vector-size: ${EMBEDDING_DIMENSIONS:512}
    dense-vector-name: ${QDRANT_DENSE_VECTOR_NAME:dense}
    bm25-vector-name: ${QDRANT_BM25_VECTOR_NAME:bm25}
    hybrid-prefetch-multiplier: ${QDRANT_HYBRID_PREFETCH_MULTIPLIER:4}
    hybrid-max-prefetch-limit: ${QDRANT_HYBRID_MAX_PREFETCH_LIMIT:100}
    bm25-token-min-length: ${QDRANT_BM25_TOKEN_MIN_LENGTH:2}
    max-concurrent-upsert-batches: ${QDRANT_MAX_CONCURRENT_UPSERT_BATCHES:2}

  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:11434}
    model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
    dimensions: ${EMBEDDING_DIMENSIONS:512}
    max-concurrent-batches: ${EMBEDDING_MAX_CONCURRENT_BATCHES:1}
    connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:10s}
    read-timeout: ${EMBEDDING_READ_TIMEOUT:2m}

  auth:
    dev-user-id: ${DEV_USER_ID:00000000-0000-0000-0000-000000000001}

server:
  port: ${SERVER_PORT:8080}
